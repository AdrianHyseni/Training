name: interchange-labs

# Optional hands-on lab environments. Run with a profile, e.g.:
#   docker compose -f docker-compose.labs.yml --profile postgres up
# Full lab content and seed datasets land in M5.

services:
  lab-postgres:
    image: pgvector/pgvector:pg17
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    ports:
      - "5433:5432"
    volumes:
      - lab_pg_data:/var/lib/postgresql/data

  lab-kafka:
    image: apache/kafka:latest
    profiles: ["kafka"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    ports:
      - "9092:9092"

  lab-kafka-ui:
    image: provectuslabs/kafka-ui:latest
    profiles: ["kafka"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: lab-kafka:9092
    ports:
      - "8080:8080"
    depends_on:
      - lab-kafka

  lab-localstack:
    image: localstack/localstack:latest
    profiles: ["aws"]
    environment:
      SERVICES: sqs,sns,eventbridge,lambda,s3
    ports:
      - "4566:4566"
    volumes:
      - lab_localstack_data:/var/lib/localstack

  lab-azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    profiles: ["azure"]
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - lab_azurite_data:/data

volumes:
  lab_pg_data:
  lab_localstack_data:
  lab_azurite_data:
