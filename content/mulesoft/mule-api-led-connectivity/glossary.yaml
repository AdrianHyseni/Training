terms:
  - term: "System API"
    definition: "An API that wraps a single backend system (database, ERP, mainframe, CRM), exposing a normalized, stable interface and hiding that system's implementation details."
  - term: "Process API"
    definition: "An API that orchestrates one or more system APIs, combining and shaping their data for a business purpose, without being aware of the specific consuming channel."
  - term: "Experience API"
    definition: "A channel-specific API, shaped for exactly one consumer (a mobile app, a web app, a partner integration), typically built on top of one or more process APIs."
  - term: "DataWeave"
    definition: "Mule's functional transformation language, used to convert payloads between shapes and formats, with explicit type coercion and first-class functions like map and reduce."
  - term: "MUnit"
    definition: "Mule's testing framework for exercising flows in isolation, including mocking connectors and downstream calls so tests don't depend on live backends."
  - term: "Global error handler"
    definition: "A centralized error-handling component at the API level that maps internal Mule error types to a consistent set of HTTP status codes and response shapes across an entire project."
  - term: "Anypoint Exchange"
    definition: "MuleSoft's shared catalog for publishing and discovering API specifications, connectors, templates, and other reusable integration assets across teams."
