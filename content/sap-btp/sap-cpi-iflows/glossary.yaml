terms:
  - term: "iFlow"
    definition: "An integration flow: the unit of design in SAP Cloud Integration, built visually and compiled to an Apache Camel route on a managed runtime."
  - term: "Content Modifier"
    definition: "A core iFlow step for setting or reading message headers, properties, and the body, often used to capture data before the payload is transformed."
  - term: "Exception Subprocess"
    definition: "A branch attached to an iFlow's main process that receives control when an unhandled exception occurs, used for logging and error-handling logic like retry routing."
  - term: "JMS adapter"
    definition: "SAP Cloud Integration's internal durable message queue adapter, commonly used to implement bounded retry for transient failures so messages survive runtime restarts."
  - term: "Splitter / Gather"
    definition: "A pair of steps where Splitter breaks one message into several independent messages, and Gather recombines the results once processing completes."
  - term: "SAP Cloud Connector"
    definition: "A component that provides secure connectivity from SAP Cloud Integration to on-premise systems (e.g. S/4HANA) without exposing them directly to the public internet."
  - term: "Integration Package"
    definition: "The deployable and versionable container for one or more iFlows, promoted across tenants (dev, test, production) as a unit."
