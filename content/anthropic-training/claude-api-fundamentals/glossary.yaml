terms:
  - term: "Messages API"
    definition: "The single Anthropic API endpoint (POST /v1/messages) used for every Claude request — single-turn Q&A, multi-turn chat, tool use, vision, and structured outputs are all parameters on this one call."
  - term: "Stateless"
    definition: "Describes an API that retains no memory between calls. The Messages API is stateless: the calling application must resend the full conversation history it wants Claude to see on every request."
  - term: "stop_reason"
    definition: "A field on every Messages API response explaining why generation ended — for example, a natural completion, hitting the max_tokens ceiling, a tool call request, or a safety-related decline."
  - term: "Server-Sent Events (SSE)"
    definition: "The streaming transport the Messages API uses when stream is set to true — a sequence of typed events (message_start, content_block_delta, message_stop, and others) delivered incrementally over a single HTTP connection."
  - term: "Token"
    definition: "The unit Claude processes text in — roughly a word or sub-word chunk. Billing, context window limits, and rate limits are all denominated in tokens, not words or characters."
  - term: "Rate limit"
    definition: "A short-term cap on API usage (requests per minute, input or output tokens per minute), enforced per model, that returns a 429 status and is generally designed to be retried after a short wait."
  - term: "Context window"
    definition: "The total number of tokens (input plus output) that fit in a single request to a given model. Long conversations or large documents can approach or exceed it."
