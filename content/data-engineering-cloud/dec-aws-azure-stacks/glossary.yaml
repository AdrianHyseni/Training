terms:
  - term: "Lakehouse"
    definition: "An architecture pattern combining data-lake-style cheap, flexible object storage with data-warehouse-style structure, ACID transactions, and query performance, typically via an open table format."
  - term: "Medallion architecture"
    definition: "A common lakehouse data organization pattern with three layers: raw/bronze (as-landed), curated/silver (cleaned and conformed), and serving/gold (aggregated, business-ready)."
  - term: "Glue Data Catalog"
    definition: "AWS's shared, Hive-metastore-compatible metadata repository that multiple query engines (Athena, Redshift Spectrum, EMR) read table schema and location from."
  - term: "OneLake"
    definition: "Microsoft Fabric's single logical, tenant-wide data lake, built on Azure Data Lake Storage Gen2, referenced directly by Fabric items like Lakehouse and Warehouse."
  - term: "Open table format"
    definition: "A specification (e.g. Apache Iceberg, Delta Lake, Apache Hudi) for storing large tabular datasets on object storage with schema evolution, ACID transactions, and time travel, readable by multiple compute engines."
  - term: "Composable data stack"
    definition: "An architecture built from separate, individually chosen services wired together (AWS's typical approach), as opposed to a single pre-integrated platform."
  - term: "Data catalog"
    definition: "A metadata service that tracks what tables/datasets exist, their schema, and their location, so multiple compute engines can share a consistent view of the data without each maintaining its own copy of that information."
