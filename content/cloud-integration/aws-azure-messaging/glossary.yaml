terms:
  - term: "Point-to-point messaging"
    definition: "A messaging pattern where each message is delivered to and processed by exactly one consumer, typically via a queue (e.g. SQS, Service Bus queue)."
  - term: "Fan-out (pub/sub)"
    definition: "A messaging pattern where one published message is delivered to every independent subscriber, each getting its own copy (e.g. SNS, Service Bus topic, Event Grid)."
  - term: "Visibility timeout"
    definition: "In SQS, the period during which a received-but-not-yet-deleted message is hidden from other consumers. If it expires before the message is deleted, the message becomes visible again for redelivery."
  - term: "Dead-letter queue (DLQ)"
    definition: "A queue that messages are automatically moved to after failing processing a configured number of times, so they stop blocking the healthy queue and can be inspected and redriven separately."
  - term: "Redrive"
    definition: "The act of moving messages from a dead-letter queue back into their source queue for reprocessing, typically after fixing the underlying cause of failure."
  - term: "Message group (SQS FIFO)"
    definition: "A set of messages sharing the same MessageGroupId within a FIFO queue; SQS guarantees ordering and exactly-once processing within a group, but not across different groups."
  - term: "Content-based routing"
    definition: "Directing events to different targets based on matching their actual field values or structure, rather than broadcasting every event to every subscriber — the core capability of EventBridge rules and Event Grid event subscriptions."
