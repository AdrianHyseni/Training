terms:
  - term: "Forward deployed engineer (FDE)"
    definition: "A software engineer who embeds inside a customer's organization to build, ship, and own working software against the customer's real data and systems, rather than configuring a product or delivering recommendations from a distance."
  - term: "Problem discovery"
    definition: "The process of finding the highest-value workflow to address and defining a measurable success target for it, typically by observing real users and real cases before any code is written."
  - term: "Pilot"
    definition: "A narrow but real, end-to-end slice of a workflow, built and run against real or realistically representative data, with agreed criteria for what 'ready for production' means."
  - term: "Shadow mode"
    definition: "Running a new system alongside an existing process on real, live data without letting its output affect real outcomes yet, so its performance can be compared safely before rollout."
  - term: "Production handoff criteria"
    definition: "The specific, agreed-upon conditions (accuracy threshold, latency, security review, stakeholder sign-off) that determine when a pilot is considered ready to take over a live workflow."
  - term: "Rapid prototyping"
    definition: "Building a thin, working version of a solution in days rather than weeks, so customers can react to something concrete instead of specifying requirements in the abstract."
  - term: "Implementation engineering"
    definition: "Configuring a vendor's existing product (connectors, low-code flows, field mappings) to match a customer's requirements, bounded by what the product already supports."
