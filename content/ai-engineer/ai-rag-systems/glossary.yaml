terms:
  - term: "Chunking"
    definition: "Splitting source documents into smaller units of text before embedding and indexing, so retrieval can return focused passages instead of whole documents."
  - term: "Hybrid search"
    definition: "Combining vector similarity search with keyword/lexical search (e.g. BM25) over the same chunk store and merging the ranked results, to cover both semantic and exact-match relevance."
  - term: "BM25"
    definition: "A term-frequency-based lexical ranking algorithm that scores documents on how well their terms match a query, weighted by term rarity and normalized for document length."
  - term: "Reranking"
    definition: "A second-pass scoring step, usually a cross-encoder model, applied to a small shortlist of retrieved candidates to reorder them more accurately than the initial retrieval step could afford to."
  - term: "Recall@k"
    definition: "A retrieval metric: the fraction of truly relevant chunks for a query that appear anywhere within the top k retrieved results."
  - term: "Mean Reciprocal Rank (MRR)"
    definition: "A retrieval metric computed as the average, across queries, of 1 divided by the rank position of the first relevant result."
  - term: "Faithfulness"
    definition: "A generation metric measuring what fraction of claims in a model's answer are actually supported by the retrieved context it was given, as opposed to invented or embellished."
