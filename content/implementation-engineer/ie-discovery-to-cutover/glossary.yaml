terms:
  - term: "Fit-gap analysis"
    definition: "A structured comparison of business requirements against a platform's standard capabilities, classifying each requirement as a fit, a gap, or a candidate for business process change."
  - term: "Solution design document (SDD)"
    definition: "The artifact that translates discovery findings into a concrete, buildable design for each in-scope process — configuration, data objects, integrations, and any required customization."
  - term: "System integration testing (SIT)"
    definition: "Technical testing, run by the implementation team, that verifies systems and integrations work together correctly — data flow, batch jobs, error handling."
  - term: "User acceptance testing (UAT)"
    definition: "Testing run by actual business users against real-world scenarios, verifying the built system genuinely supports how the business needs to operate."
  - term: "Cutover runbook"
    definition: "A detailed, step-by-step plan for the go-live window, with owners, timings, verification checks, and go/no-go decision points."
  - term: "Hypercare"
    definition: "An elevated-support period immediately after go-live, typically one to four weeks, where the implementation team stays engaged before formally handing off to standard support."
  - term: "Reconciliation"
    definition: "Verifying that data landed correctly after migration by comparing record counts, control totals, and spot checks against the source system."
