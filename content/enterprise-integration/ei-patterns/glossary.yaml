terms:
  - term: "Message channel"
    definition: "The conduit a message travels through between systems — a virtual pipe, implemented as a queue, topic, or similar construct, with either point-to-point or publish-subscribe delivery semantics."
  - term: "Content-based router"
    definition: "A pattern that inspects a message's content and sends it down one of several channels based on that content, rather than sending every message down the same path."
  - term: "Idempotency"
    definition: "The property that processing the same message or request more than once produces the same result as processing it once — essential when a system only guarantees at-least-once delivery."
  - term: "Transactional outbox pattern"
    definition: "Writing an outgoing message into a database table in the same transaction as the business change it describes, so a separate publisher can reliably deliver it without the message and the change ever going out of sync."
  - term: "Dead-letter queue (DLQ)"
    definition: "A queue that holds messages which failed processing after a bounded number of retries, so they stop blocking the main queue and remain available for inspection and replay instead of being silently lost."
  - term: "Aggregator"
    definition: "A stateful pattern that collects related messages, correlated by some key, and combines them into a single outgoing message once a condition (all expected messages arrived, or a timeout) is met."
  - term: "At-least-once delivery"
    definition: "A delivery guarantee where a message is guaranteed to arrive but may arrive more than once, typically because a consumer can crash after processing a message but before acknowledging it."
